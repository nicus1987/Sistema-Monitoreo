[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-monitoreo"
version = "0.1.0"
description = "Motor de monitoreo transaccional y prevención de fraude/PLA-FT en tiempo real (adquirencia, cash-in, cash-out)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.10"]
redis = ["redis>=5.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
monitoreo = ["api/static/*.html"]
